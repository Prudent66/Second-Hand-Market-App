# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Backend API base URL baked into the APK as BuildConfig.API_BASE_URL.
# A trailing slash is added automatically if missing.
#
# Do NOT edit the Kotlin code to change environments:
#   - local machine:  add API_BASE_URL=... to local.properties (gitignored)
#   - one-off build:  ./gradlew assembleDebug -PAPI_BASE_URL=https://your-api.example.com/
#   - CI builds:      set the API_BASE_URL repository variable on GitHub
# See DEPLOYMENT.md for details.
API_BASE_URL=https://second-hand-market-api.onrender.com/
