name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    # Dummy fallbacks keep CI green before real secrets are configured;
    # repository secrets take precedence when they exist.
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://user:pass@localhost:5432/second_hand_market' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_secret' }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID || 'AC_dummy_account_sid' }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN || 'dummy_auth_token' }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER || '+1234567890' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Lint (ESLint)
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: second-hand-market-backend:${{ github.sha }}
          load: true

      - name: Test Docker image
        run: |
          docker run --rm -d \
            -p 5000:5000 \
            -e JWT_SECRET=dummy_ci_secret \
            --name test-backend \
            second-hand-market-backend:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000/ || exit 1
          docker stop test-backend
