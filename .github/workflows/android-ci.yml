name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle


      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  lint:
    name: Lint Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle


      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results.html
          retention-days: 7

  smoke-test:
    name: Launch Smoke Test (Emulator)
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator and capture crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            ls -la debug-apk
            adb install -r debug-apk/app-debug.apk
            adb shell am start -W -n com.secondhandmarket/.MainActivity || true
            sleep 30
            PID=$(adb shell pidof com.secondhandmarket | tr -d '\r' || true)
            echo "APP PID: ${PID:-<not running>}"
            adb logcat -d > logcat.log || true
            echo "===== CRASH BUFFER ====="
            adb logcat -d -b crash || true
            echo "===== FATAL EXCEPTION (main buffer) ====="
            grep -A 120 "FATAL EXCEPTION" logcat.log || echo "(no FATAL EXCEPTION in main buffer)"
            if [ -z "$PID" ]; then
              echo "::error::App process is not running - it crashed on launch"
              exit 1
            fi
            if grep -q "FATAL EXCEPTION" logcat.log; then
              echo "::error::App crashed with a FATAL EXCEPTION"
              exit 1
            fi
            echo "Smoke test passed: app is running (pid $PID)"

      - name: Upload logcat
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logcat
          path: logcat.log
          retention-days: 7
