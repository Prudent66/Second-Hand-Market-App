name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle


      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace -PAPI_BASE_URL="${{ vars.API_BASE_URL }}"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace -PAPI_BASE_URL="${{ vars.API_BASE_URL }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  lint:
    name: Lint Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle


      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace -PAPI_BASE_URL="${{ vars.API_BASE_URL }}"

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results.html
          retention-days: 7

  smoke-test:
    name: Launch Smoke Test (Emulator)
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator and capture crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            ls -la debug-apk
            adb install -r debug-apk/app-debug.apk
            adb shell am start -W -n com.secondhandmarket/.MainActivity || true
            sleep 30
            adb shell ps -A > ps.txt
            adb logcat -d > logcat.log
            adb logcat -d -b crash > crash.log
            echo "===== APP PROCESS CHECK ====="
            if grep -q secondhandmarket ps.txt; then echo "app process is alive"; else echo "app process is NOT running"; fi
            echo "===== CRASH BUFFER ====="
            cat crash.log
            echo "===== FATAL EXCEPTION (main buffer) ====="
            grep -A 120 "FATAL EXCEPTION" logcat.log || echo "no FATAL EXCEPTION in main buffer"
            if grep -q secondhandmarket ps.txt && ! test -s crash.log && ! grep -q "FATAL EXCEPTION" logcat.log; then echo "::notice::Smoke test PASSED - app is running with no crashes"; else echo "::error::Smoke test FAILED - app crashed or process died"; exit 1; fi

      - name: Upload logcat
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logcat
          path: logcat.log
          retention-days: 7
